    <style>
        :root { 
            --bg: #050505; 
            --card: #121212; 
            --accent: #ff2d55; 
            --border: rgba(255, 255, 255, 0.08); 
        }
        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            height: 100dvh; 
            -webkit-tap-highlight-color: transparent; 
        }
        .screen { display: none; height: 100%; flex-direction: column; animation: fadeIn 0.3s ease-out; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 28px; transition: transform 0.2s; position: relative; overflow: hidden; }
        .card:active { transform: scale(0.98); }
        .card.loading { pointer-events: none; opacity: 0.7; transform: scale(0.95); }
        
        /* Slide to Reply Styles */
        .msg-wrapper {
            position: relative;
            width: 100%;
            overflow: visible;
            touch-action: pan-y;
            z-index: 10; /* Keep above wallpaper */
        }

        .reply-indicator {
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%) scale(0.5);
            opacity: 0;
            color: var(--accent);
            transition: opacity 0.1s;
            pointer-events: none;
        }

        .msg-bubble { 
            max-width: 85%; 
            padding: 14px 18px; 
            border-radius: 24px; 
            font-size: 14px; 
            position: relative; 
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            will-change: transform;
        }
        
        .msg-sent { border-bottom-right-radius: 4px; }
        .msg-received { border-bottom-left-radius: 4px; backdrop-filter: blur(10px); }
        .msg-ghost { filter: blur(12px); cursor: pointer; background: linear-gradient(45deg, #1a1a1a, #2a2a2a); }
        .msg-ghost.revealing { filter: blur(0); border: 1px solid var(--accent); }
        .msg-burned { opacity: 0.1; filter: grayscale(1) blur(2px); pointer-events: none; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .unread-badge {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.5);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 45, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0); }
        }

        /* WHATSAPP WALLPAPER LOGIC */
        #chat-messages { 
            scroll-behavior: smooth; 
            position: relative;
            background-color: #080808; 
            background-image: url('ghostroom.png');
            background-repeat: repeat;
            background-size: 380px;
            background-attachment: local;
        }

        /* Dark tint overlay so text remains readable */
        #chat-messages::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35); 
            z-index: 0;
            pointer-events: none;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: white;
            color: black;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 800;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        #loading-overlay {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        #loading-overlay.visible { opacity: 1; pointer-events: auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }

        .prompt-card {
            flex-shrink: 0;
            width: 160px;
            padding: 12px;
            border-radius: 16px;
            font-size: 11px;
            line-height: 1.4;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 1px solid transparent;
            background-size: 200% 200%;
            color: rgba(0,0,0,0.7);
        }

        .prompt-card-1 { background-image: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 100%); }
        .prompt-card-2 { background-image: linear-gradient(45deg, #a18cd1 0%, #fbc2eb 100%); }
        .prompt-card-3 { background-image: linear-gradient(45deg, #84fab0 0%, #8fd3f4 100%); }
        .prompt-card-4 { background-image: linear-gradient(45deg, #d299c2 0%, #fef9d7 100%); }
        .prompt-card-5 { background-image: linear-gradient(45deg, #fccb90 0%, #d57eeb 100%); }
        .prompt-card-6 { background-image: linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%); }

        .nav-info-item {
            font-size: 9px;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            transform: translateY(10px);
            opacity: 0;
        }
        .nav-info-item.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">

    <div id="screen-home" class="screen active p-6 overflow-y-auto pb-32 hide-scroll">
        <header class="mt-8 mb-10 flex justify-between items-start">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tighter italic">GHOSTROOM</h1>

    <div id="screen-chat" class="screen">
        <header class="p-4 flex items-center justify-between border-b border-white/5 bg-black/50 backdrop-blur-lg">
            <button id="btn-back" class="text-white/30 p-2"><i data-lucide="chevron-left"></i></button>
            <div class="text-center overflow-hidden h-[40px] flex flex-col justify-center">
                <p class="text-[10px] font-black text-pink-500 uppercase tracking-[0.2em]" id="chat-title">Whisper Room</p>
                <div id="info-carousel" class="relative h-[15px]">
                    <p class="nav-info-item absolute inset-0 transition-all duration-500 active" id="chat-subtitle">#000000</p>

                    <div class="nav-info-item absolute inset-0 transition-all duration-500 text-[8px] text-white/40 font-bold uppercase tracking-wider flex items-center justify-center gap-1">

        <div id="reply-preview" class="hidden px-4 py-3 bg-white/5 border-t border-white/10 flex justify-between items-center text-[10px]">

        <div class="p-4 pb-8 bg-black">

                    <button id="id-anon" class="flex-1 text-[10px] p-2 rounded-xl border border-white bg-white text-black">ANON</button>
                    <button id="id-uid" class="flex-1 text-[10px] p-2 rounded-xl border border-white/5 bg-white/5 text-white/40">ID</button>

                <button type="submit" id="btn-send" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center disabled:opacity-20">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, serverTimestamp, updateDoc, getDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // FIREBASE INITIALIZATION 
        const firebaseConfig = {
            apiKey: "AIzaSyCEUDD0iB4iGFSDoC0a3wCXF8PT098Su3w",
            authDomain: "anonymous-messaging-f93c0.firebaseapp.com",
            projectId: "anonymous-messaging-f93c0",
            storageBucket: "anonymous-messaging-f93c0.firebasestorage.app",
            messagingSenderId: "990716606250",
            appId: "G-GBMJM3GM3B"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const appId = 'ghostroom-v4-influence'; 

        // STATE
        let user = null;
        let currentRoom = null;
        let unsubChat = null;
        let isGhostMode = false;
        let replyingTo = null;
        let senderIdentity = 'anon';
        let timerInterval = null;
        let infoCarouselInterval = null;

        const NEW_PROMPTS = [
            "Best Nigerian Slang ever?",
            "What is the Biggest lie you told your African parents?",
            "iPhone or Samsung?",
            "Ever faked speaking in tongues or fainted in church?",
            "Worst House Chore ever?",
            "Something you did in school you can’t admit?",
            "Worst JAMB or WAEC experience?",
            "What are your biggest Dating Red Flag?"
        ];

        // UI HELPERS
        lucide.createIcons();
        const loadingOverlay = document.getElementById('loading-overlay');
        const showLoading = () => {
            loadingOverlay.classList.remove('hidden');
            setTimeout(() => loadingOverlay.classList.add('visible'), 10);
        };
        const hideLoading = () => {
            loadingOverlay.classList.remove('visible');
            setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
        };
        const showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${id}`).classList.add('active');
        };

        const showToast = (text) => {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        };

        const renderPrompts = () => {
            const container = document.querySelector('#prompt-strip .flex');
            if (!container) return;
            container.innerHTML = '';
            NEW_PROMPTS.forEach((prompt, index) => {
                const card = document.createElement('div');
                card.className = `prompt-card prompt-card-${(index % 6) + 1}`;
                card.textContent = prompt;
                card.onclick = () => {
                    const chatInput = document.getElementById('chat-input');
                    chatInput.value = prompt;
                    chatInput.focus();
                    chatInput.dispatchEvent(new Event('input', { bubbles: true }));
                };
                container.appendChild(card);
            });
        };

        const startInfoCarousel = () => {
            if (infoCarouselInterval) clearInterval(infoCarouselInterval);
            const items = document.querySelectorAll('.nav-info-item');
            let currentIndex = 0;
            infoCarouselInterval = setInterval(() => {
                items[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % items.length;
                items[currentIndex].classList.add('active');
            }, 3000);
        };

        // --- SWIPE TO REPLY LOGIC ---
        const initSwipeReply = (bubble, messageData) => {
            let startX = 0;
            let currentX = 0;
            const threshold = 60;
            const indicator = bubble.parentElement.querySelector('.reply-indicator');

            bubble.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                bubble.style.transition = 'none';
            }, { passive: true });

            bubble.addEventListener('touchmove', (e) => {
                currentX = e.touches[0].clientX - startX;
                if (currentX > 0 && currentX < 120) {
                    bubble.style.transform = `translateX(${currentX}px)`;
                    
                    // Show and animate indicator
                    indicator.style.opacity = Math.min(currentX / threshold, 1);
                    const scale = Math.min(currentX / threshold, 1.2);
                    const rotate = (currentX / threshold) * 20;
                    indicator.style.transform = `translateY(-50%) scale(${scale}) rotate(${rotate}deg)`;
                }
            }, { passive: true });

            bubble.addEventListener('touchend', () => {
                bubble.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                if (currentX >= threshold) {
                    setReply(messageData);
                    // Haptic feedback simulation
                    if (window.navigator.vibrate) window.navigator.vibrate(10);
                }
                
                bubble.style.transform = 'translateX(0)';
                indicator.style.opacity = '0';
                currentX = 0;
            });
        };

        const setReply = (m) => {
            replyingTo = m;
            document.getElementById('reply-preview').classList.remove('hidden');
            document.getElementById('reply-text').textContent = m.status === 'burned' ? '✦ VANISHED ✦' : m.text;
            document.getElementById('chat-input').focus();
        };

        document.getElementById('btn-cancel-reply').onclick = () => {
            replyingTo = null;
            document.getElementById('reply-preview').classList.add('hidden');
        };

        // AUTH & ROOM LOGIC
        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
            } catch (err) { console.error("Auth failed:", err); }
        };

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('user-id-display').textContent = `UID: ${u.uid.substring(0,6).toUpperCase()}`;
                const dot = document.getElementById('connection-dot');
                dot.className = 'w-2 h-2 rounded-full bg-green-500 mt-4 shadow-[0_0_10px_rgba(34,197,94,0.5)]';
                loadHistory();
                checkHash();
            }
        });

        const checkHash = () => {
            const rid = window.location.hash.slice(1);
            if (rid) { showLoading(); joinRoom(rid); } else { showScreen('home'); }
        };
        window.addEventListener('hashchange', checkHash);

        const createRequestRoom = async () => {
            if (!user) return;
            const btn = document.getElementById('btn-create-request');
            btn.classList.add('loading');
            document.getElementById('shimmer-request').classList.remove('hidden');
            try {
                const rid = Math.random().toString(36).substring(2, 10);
                const expiresAt = Date.now() + (24 * 60 * 60 * 1000);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rid), {
                    id: rid, type: 'request', ownerId: user.uid, createdAt: Date.now(), expiresAt, lastActivity: Date.now()
                });
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'history', rid), {
                    roomId: rid, type: 'request', isOwner: true, timestamp: Date.now(), expiresAt, unread: 0
                });
                window.location.hash = rid;
            } catch (err) { console.error(err); }
        };

        const createCommunityRoom = async () => {
            if (!user) return;
            const btn = document.getElementById('btn-create-community');
            btn.classList.add('loading');
            document.getElementById('shimmer-public').classList.remove('hidden');
            try {
                const rid = Math.random().toString(36).substring(2, 10);
                const expiresAt = Date.now() + (24 * 60 * 60 * 1000);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rid), {
                    id: rid, type: 'community', ownerId: user.uid, createdAt: Date.now(), expiresAt
                });
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'history', rid), {
                    roomId: rid, type: 'community', timestamp: Date.now(), expiresAt
                });
                window.location.hash = rid;
            } catch (err) { console.error(err); }
        };

        const joinRoom = async (rid) => {
            try {
                const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rid));
                document.querySelectorAll('.card').forEach(c => c.classList.remove('loading'));
                document.querySelectorAll('.loading-shimmer').forEach(s => s.classList.add('hidden'));

                if (!snap.exists()) { window.location.hash = ''; hideLoading(); return; }
                const data = snap.data();
                if (Date.now() > data.expiresAt) { alert("This frequency has faded."); window.location.hash = ''; hideLoading(); return; }

                currentRoom = data;
                document.getElementById('chat-title').textContent = data.type === 'request' ? 'Request Room' : 'Global Vibe';
                document.getElementById('chat-subtitle').textContent = `#${rid.toUpperCase()}`;
                if (data.ownerId) document.getElementById('creator-id').textContent = `CREATOR: ${data.ownerId.substring(0, 6).toUpperCase()}`;
                
                showScreen('chat');
                startTimer(data.expiresAt);
                listenToChat(rid);
                startInfoCarousel();
                
                const historyRef = doc(db, 'artifacts', appId, 'users', user.uid, 'history', rid);
                const historySnap = await getDoc(historyRef);
                if (!historySnap.exists()) {
                    await setDoc(historyRef, { roomId: rid, type: data.type, timestamp: Date.now(), expiresAt: data.expiresAt, unread: 0 });
                } else {
                    await updateDoc(historyRef, { unread: 0 }).catch(() => {});
                }
                hideLoading();
            } catch (error) { console.error(error); hideLoading(); }
        };

        const listenToChat = (rid) => {
            if (unsubChat) unsubChat();
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'rooms', rid, 'messages'), orderBy('createdAt', 'asc'), limit(100));
            
            unsubChat = onSnapshot(q, (snap) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                snap.docs.forEach(docSnap => {
                    const m = docSnap.data();
                    const mid = docSnap.id;

                    if (m.type === 'system') {
                        const systemMsg = document.createElement('div');
                        systemMsg.className = 'text-center text-[10px] text-white/30 font-bold my-4 relative z-10';
                        systemMsg.textContent = m.text;
                        container.appendChild(systemMsg);
                        return;
                    }

                    const isMe = m.uid === user.uid;
                    const isBurned = m.status === 'burned';
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = `msg-wrapper flex flex-col ${isMe ? 'items-end' : 'items-start'} group mb-2`;
                    
                    let identityLabel = '';
                    if (!isMe) {
                        const isOwner = currentRoom.ownerId === m.uid;
                        const name = isOwner ? 'CREATOR ✦' : (m.identity === 'custom' ? (m.customName || 'Ghost') : `GHOST_${m.uid.substring(0,4)}`);
                        identityLabel = `<div class="text-[9px] ${isOwner ? 'text-pink-500' : 'text-white/30'} font-black mb-1 px-3 uppercase">${name}</div>`;
                    }

                    // Reply Context UI
                    let replyContext = '';
                    if (m.replyTo) {
                        replyContext = `<div class="text-[10px] opacity-40 mb-1 flex items-center gap-1"><i data-lucide="corner-up-right" size="10"></i> Replying to: ${m.replyTo.substring(0,15)}...</div>`;
                    }

                    wrapper.innerHTML = `
                        <div class="reply-indicator"><i data-lucide="reply" size="20"></i></div>
                        ${identityLabel}
                        ${replyContext}
                        <div id="msg-${mid}" class="msg-bubble ${isMe ? 'bg-pink-600 msg-sent' : 'bg-black/40 border border-white/10 msg-received'}
                             ${m.isGhost && !isBurned ? 'msg-ghost' : ''} ${isBurned ? 'msg-burned' : ''}">
                            ${isBurned ? '✦ VANISHED ✦' : m.text}
                        </div>
                    `;

                    const bubble = wrapper.querySelector('.msg-bubble');
                    if (m.isGhost && !isBurned) {
                        bubble.onclick = () => revealGhost(mid);
                    }
                    
                    // Attach swipe logic
                    initSwipeReply(bubble, m);

                    container.appendChild(wrapper);
                });
                lucide.createIcons();
                container.scrollTop = container.scrollHeight;
            });
        };

        const revealGhost = async (mid) => {
            const el = document.getElementById(`msg-${mid}`);
            if (el.classList.contains('revealing')) return;
            el.classList.add('revealing');
            setTimeout(async () => {
                if (currentRoom) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoom.id, 'messages', mid), { status: 'burned' });
                }
            }, 15000);
        };

        const startTimer = (expiry) => {
            if (timerInterval) clearInterval(timerInterval);
            const update = () => {
                const diff = expiry - Date.now();
                if (diff <= 0) {
                    document.getElementById('timer-display').textContent = "EXPIRED";
                    clearInterval(timerInterval);
                } else {
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    document.getElementById('timer-display').textContent = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
            };
            update();
            timerInterval = setInterval(update, 1000);
        };

        const loadHistory = () => {
            const q = query(collection(db, 'artifacts', appId, 'users', user.uid, 'history'), orderBy('timestamp', 'desc'));
            onSnapshot(q, (snap) => {
                const container = document.getElementById('history-container');
                container.innerHTML = '';
                snap.docs.forEach(d => {
                    const item = d.data();
                    const isDead = Date.now() > item.expiresAt;
                    const div = document.createElement('div');
                    div.className = 'card p-5 flex justify-between items-center cursor-pointer active:scale-[0.98] transition-transform';
                    div.onclick = () => window.location.hash = item.roomId;
                    const unreadTag = item.unread > 0 ? `<span class="unread-badge ml-2">${item.unread} NEW</span>` : '';
                    div.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-1.5 h-1.5 rounded-full ${item.type === 'request' ? 'bg-pink-500' : 'bg-orange-500'}"></div>
                            <div>
                                <div class="font-bold text-sm flex items-center">#${item.roomId.toUpperCase()} ${unreadTag}</div>
                                <div class="text-[8px] text-white/20 font-black uppercase tracking-tighter">${item.type} room • ${isDead ? 'EXPIRED' : 'ACTIVE'}</div>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" size="14" class="text-white/10"></i>
                    `;
                    container.appendChild(div);
                });
                lucide.createIcons();
            });
        };

        initAuth();
        renderPrompts();

        document.getElementById('btn-create-request').onclick = createRequestRoom;
        document.getElementById('btn-create-community').onclick = createCommunityRoom;
        document.getElementById('btn-back').onclick = () => window.location.hash = '';
        document.getElementById('btn-share').onclick = () => {
            navigator.clipboard.writeText(window.location.href);
            showToast("LINK COPIED FOR BIO");
        };

        document.getElementById('btn-ghost-toggle').onclick = () => {
            isGhostMode = !isGhostMode;
            document.getElementById('btn-ghost-toggle').classList.toggle('text-pink-500', isGhostMode);
            document.getElementById('btn-ghost-toggle').classList.toggle('text-white/20', !isGhostMode);
        };

        document.getElementById('btn-identity-toggle').onclick = () => document.getElementById('identity-menu').classList.toggle('hidden');

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !user || !currentRoom) return;

            const msgData = {
                text,
                uid: user.uid,
                createdAt: serverTimestamp(),
                isGhost: isGhostMode,
                status: 'active',
                identity: senderIdentity,
                customName: senderIdentity === 'custom' ? document.getElementById('custom-name-input').value : null
            };

            if (replyingTo) {
                msgData.replyTo = replyingTo.text;
                replyingTo = null;
                document.getElementById('reply-preview').classList.add('hidden');
            }

            input.value = '';
            input.style.height = 'auto';
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoom.id, 'messages'), msgData);
        };

        document.getElementById('chat-input').oninput = function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        };

        const setIdentity = (type) => {
            senderIdentity = type;
            ['id-anon', 'id-uid', 'id-custom'].forEach(id => {
                const b = document.getElementById(id);
                b.className = id.includes(type) ? "flex-1 text-[10px] p-2 rounded-xl border border-white bg-white text-black" : "flex-1 text-[10px] p-2 rounded-xl border border-white/5 bg-white/5 text-white/40";
            });
            document.getElementById('custom-name-input').classList.toggle('hidden', type !== 'custom');
        };

        document.getElementById('id-anon').onclick = () => setIdentity('anon');
        document.getElementById('id-uid').onclick = () => setIdentity('uid');
        document.getElementById('id-custom').onclick = () => setIdentity('custom');

    </script>
</body>
</html>
